<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПРЕВЬЮ — запись из лида (сетка-журнал)</title>
<style>
:root{
  --primary:#7c3aed; --primary-hover:#6d28d9; --primary-light:#ede9fe; --primary-bg:#f5f3ff;
  --bg:#faf5ff; --card:#fff; --text:#1f2937; --text-secondary:#6b7280; --text-muted:#9ca3af;
  --border:#e5e7eb; --border-light:#f3f4f6; --success:#059669; --success-bg:#ecfdf5;
  /* акцентные цвета блоков */
  --svc-accent:#4f46e5; --svc-bg:#eef2ff; --svc-text:#3730a3;
  --sch-accent:#059669; --sch-bg:#ecfdf5; --sch-text:#065f46;
  --busy:#d1fae5; --busy-border:#6ee7b7; --busy-text:#065f46;
  --error:#dc2626; --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;padding:16px}
#app{max-width:1200px;margin:0 auto}

.preview-tag{background:#fff8e1;border:1px solid #ffe082;color:#7a5d00;border-radius:8px;padding:8px 14px;font-size:13px;margin-bottom:14px}

/* === CLIENT (фиолетовый) === */
.client-card{background:var(--primary-bg);border:1px solid var(--primary-light);border-left:4px solid var(--primary);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;align-items:center;gap:12px}
.client-info{flex:1}
.client-name{font-weight:700;font-size:16px;color:var(--primary-hover)}
.client-meta{color:var(--text-secondary);font-size:13px}
.branch-badge{background:var(--primary);color:#fff;padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600}

/* === ACCORDION === */
.acc{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none;font-weight:600}
.acc-head .num{font-size:18px}
.acc-head .ttl{font-size:14px}
.acc-head .sub{margin-left:auto;font-weight:500;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.acc-head .chev{transition:transform .15s;font-size:12px;margin-left:6px}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-head.services{background:var(--svc-bg);color:var(--svc-text);border-left:4px solid var(--svc-accent)}
.acc-head.schedule{background:var(--sch-bg);color:var(--sch-text);border-left:4px solid var(--sch-accent)}
.acc-body{display:none}
.acc.open .acc-body{display:block}

/* === SERVICE PICKER === */
.svc-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border-light);cursor:pointer}
.svc-row:hover{background:var(--svc-bg)}
.svc-check{width:18px;height:18px;cursor:pointer;accent-color:var(--svc-accent)}
.svc-name{flex:1}
.svc-row.on .svc-name{font-weight:600;color:var(--svc-text)}
.svc-meta{color:var(--text-muted);font-size:12px;white-space:nowrap}
.svc-price{font-weight:600;white-space:nowrap}
.svc-add-box{padding:10px 16px;border-top:1px solid var(--border-light)}
.svc-add-input{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;outline:none}
.svc-add-input:focus{border-color:var(--svc-accent)}
.svc-add-result{margin-top:8px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.svc-add-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--border-light)}
.svc-add-item:first-child{border-top:none}
.svc-add-item:hover{background:var(--svc-bg)}
.svc-add-plus{margin-left:auto;background:var(--svc-bg);color:var(--svc-accent);border-radius:var(--radius-sm);padding:3px 9px;font-size:13px;font-weight:600}
.svc-summary{padding:10px 16px;border-top:1px solid var(--border-light);display:flex;gap:16px;font-size:13px;background:var(--svc-bg)}
.svc-summary b{color:var(--svc-accent)}

/* === TOOLBAR === */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500}
.nav-btn:hover{border-color:var(--sch-accent);color:var(--sch-text)}
.date-label{font-weight:600;font-size:15px;min-width:170px;text-align:center}
.staff-filter{margin-left:auto;display:flex;align-items:center;gap:8px}
.staff-filter select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;font-size:14px;outline:none;cursor:pointer;background:var(--card)}

/* === GRID === */
.grid-wrap{overflow:auto;max-height:460px}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed}
table.grid th,table.grid td{border:1px solid var(--border-light)}
table.grid thead th{position:sticky;top:0;background:var(--sch-bg);z-index:2;padding:9px 6px;font-size:13px;font-weight:600;color:var(--text)}
table.grid thead th .spec{display:block;font-weight:400;font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-time{width:60px}
td.time{background:var(--sch-bg);color:var(--text-secondary);font-size:12px;text-align:center;width:60px;height:32px;vertical-align:top;padding-top:2px}
td.free{height:32px;cursor:pointer;transition:background .1s}
td.free:hover{background:var(--primary-light)}
td.free.sel{background:var(--primary);outline:2px solid var(--primary-hover);outline-offset:-2px}
td.busy{background:var(--busy);border-color:var(--busy-border);color:var(--busy-text);font-size:11px;line-height:1.3;padding:4px 6px;vertical-align:top}
td.busy .b-time{font-weight:600}
td.busy .b-client{font-weight:600}
td.busy .b-svc{color:#047857;font-size:10px;display:block;overflow:hidden}

/* === CONFIRM (фиолетовый) === */
.confirm{background:var(--card);border:2px solid var(--primary);border-radius:var(--radius);box-shadow:0 6px 20px rgba(124,58,237,.18);padding:16px 18px;margin-bottom:14px}
.confirm-title{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--primary)}
.confirm-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.confirm-grid .k{color:var(--text-secondary)}
.confirm-grid .v{font-weight:500}
.btn-row{display:flex;gap:10px}
.btn{flex:1;border:none;padding:13px;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:disabled{background:var(--text-muted);cursor:not-allowed}
.btn-ghost{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--text-secondary)}
.btn-ghost:hover{border-color:var(--error);color:var(--error)}
.hint{color:var(--text-muted);font-size:12px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--success);color:#fff;padding:14px 22px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;z-index:100;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>

<script>
// =====================================================================
// ПРЕВЬЮ booking-сетки для lead.html (Виджет-06, Фаза A) — v2.
// Данные ЗАПЕЧЕНЫ (3 врача МХ + записи 1 июня). BX24/YC не вызываются.
// =====================================================================

var DUR_SLOT = 1800;   // 30 мин
var START_MIN = 540;   // 9:00
var END_MIN = 1110;    // 18:30
var SLOTS = (END_MIN - START_MIN) / 30 + 1; // 9:00..18:30 = 20 строк

var state = {
  client: { name: 'Магомед markins', phone: '+7 963 798-43-42' },
  filial: 'Махачкала',
  openServices: false,   // по умолчанию свёрнуто (видно сводку)
  openSchedule: true,    // журнал сразу открыт
  discussed: [
    { id: 101, name: 'Биоревитализация: Лицо', price: 12000, duration: 3600, checked: false },
    { id: 102, name: 'Чистка - Механическая',  price: 2800,  duration: 3600, checked: false },
    { id: 103, name: 'Lumecca - Лицо',          price: 15000, duration: 3600, checked: true  },
    { id: 104, name: 'Массаж стоп',             price: 700,   duration: 1800, checked: true  }
  ],
  catalog: [
    { id: 105, name: 'Консультация', price: 1000, duration: 1800 },
    { id: 106, name: 'Коллагеностимуляция', price: 12000, duration: 3600 },
    { id: 107, name: 'SMAS-лифтинг: Шея', price: 10000, duration: 3600 },
    { id: 108, name: 'Лазерная эпиляция - Бикини тотальное', price: 3000, duration: 3600 },
    { id: 109, name: 'Forma V - курс 3 сеансов', price: 18000, duration: 5400 },
    { id: 110, name: 'Антицеллюлитный массаж - Бёдра+ягодицы', price: 1200, duration: 3600 }
  ],
  staff: [
    { id: 1919310, name: 'Майдат Умахановна', spec: 'Холодная/горячая плазма, фракц. мезотерапия' },
    { id: 2300932, name: 'Саида Зауровна', spec: 'Врач - косметолог' },
    { id: 2656437, name: 'Джамиля Джавидовна', spec: 'Дерматолог-косметолог, аппаратная' }
  ],
  recordsByDate: {
    '2026-06-01': [
      { staff_id: 2300932, datetime: '2026-06-01T14:00:00+03:00', seance_length: 8100, client: 'айзада', services: ['Lumecca - Лицо','Лазерная эпиляция','Forma V'] },
      { staff_id: 2300932, datetime: '2026-06-01T16:30:00+03:00', seance_length: 3600, client: 'Патя', services: ['Биоревитализация: Лицо'] },
      { staff_id: 1919310, datetime: '2026-06-01T13:00:00+03:00', seance_length: 1800, client: 'Ася', services: ['Консультация'] },
      { staff_id: 1919310, datetime: '2026-06-01T15:00:00+03:00', seance_length: 1800, client: 'Рамина', services: ['Консультация'] }
    ],
    '2026-06-02': [
      { staff_id: 2656437, datetime: '2026-06-02T11:00:00+03:00', seance_length: 5400, client: 'Зарема', services: ['SMAS-лифтинг'] }
    ]
  },
  date: '2026-06-01',
  filterStaff: null,
  selected: null,
  search: ''
};

function pad(n){ return n<10 ? '0'+n : ''+n; }
function slotToTime(i){ var m=START_MIN+i*30; return pad(Math.floor(m/60))+':'+pad(m%60); }
function dtToSlot(dt){ var hh=+dt.substr(11,2), mm=+dt.substr(14,2); return Math.round((hh*60+mm-START_MIN)/30); }
function spanOf(len){ return Math.max(1, Math.ceil(len/DUR_SLOT)); }
function money(n){ return n.toLocaleString('ru-RU')+' ₽'; }
function dur(sec){ var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60); var r=(h?h+' ч ':'')+(m?m+' мин':''); return r.trim()||'0'; }
function ddmm(s){ var mn=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']; var d=new Date(s+'T12:00:00'); return d.getDate()+' '+mn[d.getMonth()]; }
function weekday(s){ var w=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота']; return w[new Date(s+'T12:00:00').getDay()]; }
function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shiftDate(s,days){ var d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+days); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function selectedServices(){ return state.discussed.filter(function(s){return s.checked;}); }
function totalDuration(){ return selectedServices().reduce(function(a,s){return a+s.duration;},0); }
function totalPrice(){ return selectedServices().reduce(function(a,s){return a+s.price;},0); }
function visibleStaff(){ return state.filterStaff ? state.staff.filter(function(s){return s.id===state.filterStaff;}) : state.staff; }

function busyMap(staffId){
  var map={};
  (state.recordsByDate[state.date]||[]).filter(function(r){return r.staff_id===staffId;}).forEach(function(r){
    var st=dtToSlot(r.datetime); if(st<0||st>=SLOTS) return;
    var sp=spanOf(r.seance_length);
    map[st]={type:'start',rec:r,span:Math.min(sp,SLOTS-st)};
    for(var k=1;k<sp && st+k<SLOTS;k++) map[st+k]={type:'cont'};
  });
  return map;
}

function render(){
  var sel=selectedServices();
  var html='';
  html+='<div class="preview-tag">🔎 ПРЕВЬЮ интерфейса (v2). Данные запечены (3 врача МХ + реальные записи 1 июня). «Создать запись» показывает что улетело бы в YC.</div>';

  // CLIENT
  html+='<div class="client-card"><div class="client-info">';
  html+='<div class="client-name">'+esc(state.client.name)+'</div>';
  html+='<div class="client-meta">'+esc(state.client.phone)+' · контакт из лида</div>';
  html+='</div><div class="branch-badge">'+esc(state.filial)+'</div></div>';

  // ACCORDION 1 — SERVICES
  var selNames = sel.length ? sel.map(function(s){return s.name;}).join(', ') : 'ничего не выбрано';
  html+='<div class="acc'+(state.openServices?' open':'')+'">';
  html+='<div class="acc-head services" data-acc="services">';
  html+='<span class="num">①</span><span class="ttl">Какие услуги записываем</span>';
  html+='<span class="sub">'+sel.length+' выбрано · '+money(totalPrice())+(sel.length?' · '+esc(selNames):'')+'</span>';
  html+='<span class="chev">▶</span></div>';
  html+='<div class="acc-body">';
  state.discussed.forEach(function(s,i){
    html+='<label class="svc-row'+(s.checked?' on':'')+'">';
    html+='<input type="checkbox" class="svc-check" data-svc="'+i+'" '+(s.checked?'checked':'')+'>';
    html+='<span class="svc-name">'+esc(s.name)+'</span>';
    html+='<span class="svc-meta">'+dur(s.duration)+'</span>';
    html+='<span class="svc-price">'+money(s.price)+'</span></label>';
  });
  html+='<div class="svc-add-box">';
  html+='<input type="text" class="svc-add-input" id="svc-search" placeholder="+ Добавить услугу: поиск по названию..." value="'+esc(state.search)+'">';
  var q=state.search.toLowerCase().trim();
  if(q.length>=2){
    var have=state.discussed.map(function(s){return s.id;});
    var found=state.catalog.filter(function(s){return s.name.toLowerCase().indexOf(q)>-1 && have.indexOf(s.id)===-1;}).slice(0,6);
    html+='<div class="svc-add-result">';
    if(!found.length) html+='<div class="svc-add-item" style="color:var(--text-muted)">Ничего не найдено</div>';
    found.forEach(function(s){ html+='<div class="svc-add-item" data-addsvc="'+s.id+'"><span>'+esc(s.name)+'</span><span class="svc-meta">'+money(s.price)+'</span><span class="svc-add-plus">+ добавить</span></div>'; });
    html+='</div>';
  }
  html+='</div>';
  html+='<div class="svc-summary">Выбрано: <b>'+sel.length+'</b> · Длительность: <b>'+(totalDuration()?dur(totalDuration()):'—')+'</b> · Сумма: <b>'+money(totalPrice())+'</b></div>';
  html+='</div></div>';

  // ACCORDION 2 — SCHEDULE
  html+='<div class="acc'+(state.openSchedule?' open':'')+'">';
  html+='<div class="acc-head schedule" data-acc="schedule">';
  html+='<span class="num">②</span><span class="ttl">Журнал — выбрать время</span>';
  html+='<span class="sub">'+ddmm(state.date)+', '+weekday(state.date)+(state.filterStaff?' · '+esc((state.staff.find(function(x){return x.id===state.filterStaff;})||{}).name):'')+'</span>';
  html+='<span class="chev">▶</span></div>';
  html+='<div class="acc-body">';
  html+='<div class="toolbar">';
  html+='<button class="nav-btn" data-nav="today">Сегодня</button>';
  html+='<button class="nav-btn" data-nav="-1">‹</button>';
  html+='<div class="date-label">'+ddmm(state.date)+', '+weekday(state.date)+'</div>';
  html+='<button class="nav-btn" data-nav="1">›</button>';
  html+='<div class="staff-filter"><span style="color:var(--text-secondary);font-size:13px">Врач:</span><select id="staff-sel">';
  html+='<option value="">Все врачи</option>';
  state.staff.forEach(function(s){ html+='<option value="'+s.id+'" '+(state.filterStaff===s.id?'selected':'')+'>'+esc(s.name)+'</option>'; });
  html+='</select></div></div>';

  var staff=visibleStaff();
  var maps={}; staff.forEach(function(s){ maps[s.id]=busyMap(s.id); });
  html+='<div class="grid-wrap"><table class="grid"><thead><tr><th class="col-time"></th>';
  staff.forEach(function(s){ html+='<th>'+esc(s.name)+'<span class="spec">'+esc(s.spec)+'</span></th>'; });
  html+='</tr></thead><tbody>';
  for(var r=0;r<SLOTS;r++){
    html+='<tr><td class="time">'+slotToTime(r)+'</td>';
    staff.forEach(function(s){
      var cell=maps[s.id][r];
      if(cell && cell.type==='cont') return;
      if(cell && cell.type==='start'){
        var rec=cell.rec;
        html+='<td class="busy" rowspan="'+cell.span+'"><div class="b-time">'+rec.datetime.substr(11,5)+'</div><div class="b-client">'+esc(rec.client||'Занято')+'</div><span class="b-svc">'+esc(rec.services.join(', '))+'</span></td>';
      } else {
        var isSel=state.selected && state.selected.staffId===s.id && state.selected.slot===r;
        html+='<td class="free'+(isSel?' sel':'')+'" data-staff="'+s.id+'" data-slot="'+r+'"></td>';
      }
    });
    html+='</tr>';
  }
  html+='</tbody></table></div></div></div>';

  // CONFIRM
  if(state.selected){
    var stf=state.staff.find(function(x){return x.id===state.selected.staffId;});
    var canBook=sel.length>0;
    html+='<div class="confirm"><div class="confirm-title">Подтверждение записи</div><div class="confirm-grid">';
    html+='<div class="k">Клиент</div><div class="v">'+esc(state.client.name)+' · '+esc(state.client.phone)+'</div>';
    html+='<div class="k">Услуги</div><div class="v">'+(canBook?esc(sel.map(function(s){return s.name;}).join(', ')):'<span style="color:var(--error)">не отмечены</span>')+'</div>';
    html+='<div class="k">Врач</div><div class="v">'+esc(stf?stf.name:'')+'</div>';
    html+='<div class="k">Дата и время</div><div class="v">'+ddmm(state.date)+', '+slotToTime(state.selected.slot)+'</div>';
    html+='<div class="k">Длительность</div><div class="v">'+(totalDuration()?dur(totalDuration()):'—')+'</div>';
    html+='<div class="k">Сумма</div><div class="v">'+money(totalPrice())+'</div></div>';
    html+='<div class="btn-row"><button class="btn btn-primary" id="btn-create" '+(canBook?'':'disabled')+'>Создать запись</button><button class="btn btn-ghost" id="btn-cancel">Отмена</button></div>';
    if(!canBook) html+='<div class="hint">↑ Открой блок ① и отметь галочками услуги, на которые записываем.</div>';
    html+='</div>';
  }

  document.getElementById('app').innerHTML=html;
  bind();
}

function bind(){
  document.querySelectorAll('[data-acc]').forEach(function(h){
    h.addEventListener('click',function(){
      var k=h.getAttribute('data-acc');
      if(k==='services') state.openServices=!state.openServices; else state.openSchedule=!state.openSchedule;
      render();
    });
  });
  document.querySelectorAll('[data-svc]').forEach(function(cb){
    cb.addEventListener('click',function(e){ e.stopPropagation(); });
    cb.addEventListener('change',function(){ state.discussed[+cb.getAttribute('data-svc')].checked=cb.checked; render(); });
  });
  var si=document.getElementById('svc-search');
  if(si) si.addEventListener('input',function(e){ state.search=e.target.value; render(); var x=document.getElementById('svc-search'); if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length);} });
  document.querySelectorAll('[data-addsvc]').forEach(function(el){
    el.addEventListener('click',function(){
      var id=+el.getAttribute('data-addsvc'), svc=state.catalog.find(function(s){return s.id===id;});
      if(svc){ state.discussed.push({id:svc.id,name:svc.name,price:svc.price,duration:svc.duration,checked:true}); state.search=''; render(); }
    });
  });
  document.querySelectorAll('[data-nav]').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.getAttribute('data-nav');
      if(v==='today') state.date='2026-06-01'; else state.date=shiftDate(state.date,+v);
      state.selected=null; render();
    });
  });
  var ss=document.getElementById('staff-sel');
  if(ss) ss.addEventListener('change',function(){ state.filterStaff=ss.value?+ss.value:null; state.selected=null; render(); });
  document.querySelectorAll('td.free').forEach(function(td){
    td.addEventListener('click',function(){ state.selected={staffId:+td.getAttribute('data-staff'),slot:+td.getAttribute('data-slot')}; render(); });
  });
  var bc=document.getElementById('btn-create'); if(bc) bc.addEventListener('click',doCreate);
  var bx=document.getElementById('btn-cancel'); if(bx) bx.addEventListener('click',function(){ state.selected=null; render(); });
}

function doCreate(){
  var stf=state.staff.find(function(x){return x.id===state.selected.staffId;}), sel=selectedServices();
  var body={ staff_id:state.selected.staffId, services:sel.map(function(s){return {id:s.id,amount:1};}),
    client:{phone:state.client.phone,name:state.client.name},
    datetime:state.date+'T'+slotToTime(state.selected.slot)+':00+03:00', seance_length:totalDuration(), save_if_busy:false };
  var t=document.createElement('div'); t.className='toast';
  t.innerHTML='✅ (превью) В YC ушла бы запись: '+sel.map(function(s){return s.name;}).join(', ')+' · '+stf.name+' · '+ddmm(state.date)+' '+slotToTime(state.selected.slot)+' · клиент '+state.client.name;
  document.body.appendChild(t); setTimeout(function(){t.remove();},6000);
  console.log('POST records/671663 body =', JSON.stringify(body,null,2));
}

render();
</script>
